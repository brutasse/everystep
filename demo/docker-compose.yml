services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo"]
      interval: 2s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "8000:8000"
    command: ["sh", "entrypoint.sh", "python manage.py runserver 0.0.0.0:8000"]

  worker:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      [
        "sh",
        "entrypoint.sh",
        "python manage.py everystep_worker --name demo-worker --poll 0.2 --pool 4",
      ]

  seeder:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      [
        "sh",
        "entrypoint.sh",
        "python manage.py feed_demo --burst 30 --interval 5 --drip 2",
      ]
